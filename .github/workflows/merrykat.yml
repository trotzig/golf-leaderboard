name: merrykat

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run anyway; cancelling saves the CI minutes.
concurrency:
  group: merrykat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # merrykat resolves the merge base and the PR's diff with local `git merge-base`/`git
          # diff`, which needs history. The default fetch-depth: 1 makes both silently
          # unavailable — every run becomes a first_run with no code context, never an error —
          # so this isn't optional.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build-storybook

      - name: Upload the build to Merrykat
        run: npx merrykat upload --dir ./storybook-static
